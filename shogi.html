<script>
// ============================================================
//  将棋エンジン（5×5）― tsume3.html と共通
// ============================================================
const FWD = {sente: -1, gote: 1};
const PROMOTE_MAP = {
  '銀':'成銀','桂':'成桂','香':'成香','歩':'と','飛':'龍','角':'馬'
};
const DEMOTE_MAP = {};
for (const [k,v] of Object.entries(PROMOTE_MAP)) DEMOTE_MAP[v] = k;

function getAttacks(board, r, c) {
  const p = board[r][c];
  if (!p) return [];
  const fwd = FWD[p.side];
  const name = p.promoted ? PROMOTE_MAP[p.name] || p.name : p.name;
  const res  = [];
  const addStep = (dr, dc) => {
    const nr = r+dr, nc = c+dc;
    if (nr>=0&&nr<5&&nc>=0&&nc<5) res.push([nr,nc]);
  };
  const addSlide = (dr, dc) => {
    let nr=r+dr, nc=c+dc;
    while (nr>=0&&nr<5&&nc>=0&&nc<5) {
      res.push([nr,nc]);
      if (board[nr][nc]) break;
      nr+=dr; nc+=dc;
    }
  };
  if (name==='王') {
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++)
      if (dr||dc) addStep(dr,dc);
  } else if (['金','成銀','成桂','成香','と'].includes(name)) {
    [[fwd,0],[fwd,1],[fwd,-1],[0,1],[0,-1],[-fwd,0]].forEach(([dr,dc])=>addStep(dr,dc));
  } else if (name==='銀') {
    [[fwd,0],[fwd,1],[fwd,-1],[-fwd,1],[-fwd,-1]].forEach(([dr,dc])=>addStep(dr,dc));
  } else if (name==='飛') {
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>addSlide(dr,dc));
  } else if (name==='龍') {
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>addSlide(dr,dc));
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>addStep(dr,dc));
  } else if (name==='角') {
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>addSlide(dr,dc));
  } else if (name==='馬') {
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>addSlide(dr,dc));
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>addStep(dr,dc));
  } else if (name==='香') {
    addSlide(fwd, 0);
  } else if (name==='桂') {
    addStep(2*fwd, 1); addStep(2*fwd, -1);
  } else if (name==='歩') {
    addStep(fwd, 0);
  }
  return res.filter(([nr,nc]) => {
    const t = board[nr][nc];
    return !t || t.side !== p.side;
  });
}

function findKing(board, side) {
  for (let r=0;r<5;r++) for (let c=0;c<5;c++) {
    const p=board[r][c];
    if (p && p.name==='王' && p.side===side) return [r,c];
  }
  return null;
}

function isInCheck(board, side) {
  const k = findKing(board, side);
  if (!k) return false;
  const opp = side==='sente'?'gote':'sente';
  for (let tr=0;tr<5;tr++) for (let tc=0;tc<5;tc++) {
    const p = board[tr][tc];
    if (!p || p.side!==opp) continue;
    if (getAttacks(board,tr,tc).some(([ar,ac])=>ar===k[0]&&ac===k[1])) return true;
  }
  return false;
}

function copyBoard(board) {
  return board.map(row => row.map(cell => cell ? {...cell} : null));
}

function applyMove(board, hand, move, side) {
  const b = copyBoard(board);
  const h = hand.map(x=>({...x}));
  if (move.drop) {
    const idx = h.findIndex(x=>x.name===move.drop&&x.side===side);
    if (idx>=0) h.splice(idx,1);
    b[move.tr][move.tc] = {name:move.drop, side, promoted:false};
  } else {
    const cap = b[move.tr][move.tc];
    if (cap) h.push({name: DEMOTE_MAP[cap.name]||cap.name, side, promoted:false});
    b[move.tr][move.tc] = {...b[move.fr][move.fc]};
    b[move.fr][move.fc] = null;
    if (move.promote) b[move.tr][move.tc].promoted = true;
  }
  return {board:b, hand:h};
}

function getLegalMoves(board, hand, side) {
  const moves = [];
  for (let fr=0;fr<5;fr++) for (let fc=0;fc<5;fc++) {
    const p = board[fr][fc];
    if (!p||p.side!==side) continue;
    for (const [tr,tc] of getAttacks(board,fr,fc)) {
      const bases = [false];
      const promZone = side==='sente' ? [0,1] : [3,4];
      if (!p.promoted && PROMOTE_MAP[p.name] &&
          (promZone.includes(fr)||promZone.includes(tr))) bases.push(true);
      for (const promote of bases) {
        const {board:nb} = applyMove(board, hand, {fr,fc,tr,tc,promote}, side);
        if (!isInCheck(nb, side)) moves.push({fr,fc,tr,tc,promote});
      }
    }
  }
  const seen = new Set();
  for (const h of hand) {
    if (h.side!==side||seen.has(h.name)) continue;
    seen.add(h.name);
    for (let tr=0;tr<5;tr++) for (let tc=0;tc<5;tc++) {
      if (board[tr][tc]) continue;
      if (h.name==='歩') {
        let dup=false;
        for (let r2=0;r2<5;r2++) {
          const p2=board[r2][tc];
          if (p2&&p2.side===side&&p2.name==='歩'&&!p2.promoted) {dup=true;break;}
        }
        if (dup) continue;
      }
      const {board:nb} = applyMove(board, hand, {drop:h.name,tr,tc}, side);
      if (!isInCheck(nb, side)) moves.push({drop:h.name,tr,tc});
    }
  }
  return moves;
}

// 後手の持ち駒を考慮した詰み判定（詰将棋慣例：後手は全駒持ち）
const GOTE_INF_HAND = ['金','銀','飛','角','桂','香','歩'].map(n=>({name:n,side:'gote',promoted:false}));

function isCheckmateFull(board, side) {
  if (!isInCheck(board, side)) return false;
  const hand = side==='gote' ? GOTE_INF_HAND : [];
  return getLegalMoves(board, hand, side).length === 0;
}

// ============================================================
//  問題データ（5×5、先手=白駒=下側、前=行番号減少方向）
//  全問：隣接王手（合い駒不可）、逃げ道ゼロ検証済み
// ============================================================
const N = null;
const S = (n, p) => ({name:n, side:'sente', promoted:!!p});
const G = (n, p) => ({name:n, side:'gote',  promoted:!!p});

const PROBLEMS = [
  // ─────────────────────────────────────────────
  // 問1: 王[0,4]（右端上角）、持ち駒 金
  //  正解: drop 金 at [1,4]
  //   金[1,4]→前[0,4]=王手(隣接) / 逃げ:[0,3]←金斜め前, [1,3]←金左, [1,4]←金自身
  // ─────────────────────────────────────────────
  {
    id: 1,
    title: '問題1：持ち駒の金を打つ',
    desc: '後手の王将は右端の角にいる。持ち駒の金将を打って1手で詰ませよう。',
    hint: '王将の逃げ道は3マス。金将1枚でその3マスすべてをふさげる場所はどこ？',
    board: [
      [N, N, N, N, G('王')],
      [N, N, N, N, N],
      [N, N, N, N, N],
      [N, N, N, N, N],
      [N, N, N, N, N],
    ],
    sHand: [{name:'金', side:'sente', promoted:false}],
    answerDesc: '金将を1行4列（王将の真下）に打つ',
    answerWhy:  '金将を[1,4]に打つと「前」の利きで王将[0,4]に王手。王将の逃げ道[0,3]は金の斜め前・[1,3]は金の左・[1,4]は金自身でふさがれて詰み。',
  },
  // ─────────────────────────────────────────────
  // 問2: 王[0,0]（左端上角）、金[2,1]
  //  正解: 金[2,1]→[1,0]
  //   金[1,0]→前[0,0]=王手(隣接) / 逃げ:[0,1]←金斜め前右, [1,1]←金右, [1,0]←金自身
  // ─────────────────────────────────────────────
  {
    id: 2,
    title: '問題2：盤上の金を動かす',
    desc: '後手の王将は左端の角にいる。盤上の金将を1手動かして詰ませよう。',
    hint: '金将は前・横・斜め前に動ける。今の位置から1マス動かすと王手になる場所は？',
    board: [
      [G('王'), N, N, N, N],
      [N, N, N, N, N],
      [N, S('金'), N, N, N],
      [N, N, N, N, N],
      [N, N, N, N, N],
    ],
    sHand: [],
    answerDesc: '金将を[2,1]→[1,0]に移動',
    answerWhy:  '金将を[1,0]に進めると「前」の利きで王将[0,0]に王手。王将の逃げ道[0,1]は金の斜め前右・[1,1]は金の右・[1,0]は金自身でふさがれて詰み。',
  },
  // ─────────────────────────────────────────────
  // 問3: 王[0,0]、飛[3,0]、歩(後手)[1,0]、金[1,2]
  //  正解: 飛[3,0]→[1,0]（歩取り、王に隣接・合い駒不可）
  //   飛[1,0]→前[0,0]=王手(1マス隣接) / 逃げ:[0,1]←金斜め前左, [1,0]←飛自身, [1,1]←金左
  // ─────────────────────────────────────────────
  {
    id: 3,
    title: '問題3：飛車で歩を取りながら王手',
    desc: '飛車の前に後手の歩がいる。歩を取りながら1手で詰ませよう。',
    hint: '飛車で後手の歩を取ると王将の真横に飛車が来る。そこから何が起きる？',
    board: [
      [G('王'), N, N, N, N],
      [G('歩'), N, S('金'), N, N],
      [N, N, N, N, N],
      [S('飛'), N, N, N, N],
      [N, N, N, N, N],
    ],
    sHand: [],
    answerDesc: '飛車を[3,0]→[1,0]に動かして後手の歩を取る',
    answerWhy:  '飛車が[1,0]に着地すると王将[0,0]に「前」の利きで王手（隣接1マスなので合い駒できない）。王将の逃げ道[0,1]は金[1,2]の斜め前左・[1,0]は飛車自身・[1,1]は金[1,2]の左でふさがれて詰み。',
  },
  // ─────────────────────────────────────────────
  // 問4: 王[0,0]、飛[1,3]、持ち駒 金
  //  正解: drop 金 at [1,1]
  //   金[1,1]→斜め前左[0,0]=王手(隣接) / 逃げ:[0,1]←金前, [1,0]←金左, [1,1]←金自身
  //   ※王が金を取ろうとすると飛[1,3]横利き[1,1]で取り返せない
  // ─────────────────────────────────────────────
  {
    id: 4,
    title: '問題4：持ち駒の金＋飛車の連携',
    desc: '飛車が盤上にある。持ち駒の金将を打って1手で詰ませよう。',
    hint: '金将を打った後に「飛車がその金を守れる」位置に打てば、王将は金を取れない。',
    board: [
      [G('王'), N, N, N, N],
      [N, N, N, S('飛'), N],
      [N, N, N, N, N],
      [N, N, N, N, N],
      [N, N, N, N, N],
    ],
    sHand: [{name:'金', side:'sente', promoted:false}],
    answerDesc: '金将を[1,1]に打つ',
    answerWhy:  '金将を[1,1]に打つと斜め前左の利きで王将[0,0]に王手。逃げ道[0,1]は金の前・[1,0]は金の左・[1,1]は金自身でふさがれる。王将が金を取ろうとしても飛車[1,3]の横の利きが[1,1]を守っているので取れない。詰み！',
  },
  // ─────────────────────────────────────────────
  // 問5: 王[0,4]、金[0,2]、金[2,4]、持ち駒 銀
  //  正解: drop 銀 at [1,3]
  //   銀[1,3]→斜め前右[0,4]=王手(隣接) / 逃げ:[0,3]←銀前, [1,3]←銀自身, [1,4]←金[2,4]前
  //   ※王が銀を取ろうとすると金[2,4]の斜め前左[1,3]で守られているので取れない
  // ─────────────────────────────────────────────
  {
    id: 5,
    title: '問題5：持ち駒の銀で斜め王手',
    desc: '金将2枚が盤上にいる。持ち駒の銀将を打って1手で詰ませよう。',
    hint: '銀将は斜め前にも1マス動ける。王将の斜め下から王手をかけられる場所は？',
    board: [
      [N, N, S('金'), N, G('王')],
      [N, N, N, N, N],
      [N, N, N, N, S('金')],
      [N, N, N, N, N],
      [N, N, N, N, N],
    ],
    sHand: [{name:'銀', side:'sente', promoted:false}],
    answerDesc: '銀将を[1,3]に打つ',
    answerWhy:  '銀将を[1,3]に打つと斜め前右の利きで王将[0,4]に王手（隣接1マスなので合い駒できない）。逃げ道[0,3]は銀の前・[1,4]は金[2,4]の前・[1,3]は銀自身でふさがれる。王将が銀を取ろうとしても金[2,4]の斜め前左の利きが[1,3]を守っているので取れない。詰み！',
  },
];

// ============================================================
//  ゲーム状態
// ============================================================
let prob, board, sHand, phase, selected, selectedHandKoma;
let lastFrom, lastTo;
let pendingPromote = null;
const clearedSet = new Set();

function initProblem(idx) {
  prob = PROBLEMS[idx];
  board = prob.board.map(row => row.map(c => c ? {...c} : null));
  sHand = prob.sHand ? prob.sHand.map(h => ({...h})) : [];
  phase = 'move1';
  selected = null; selectedHandKoma = null;
  lastFrom = null; lastTo = null;
  renderGame();
}

// ============================================================
//  描画
// ============================================================
function renderNav() {
  const idx = PROBLEMS.indexOf(prob);
  const el = document.getElementById('probCounter');
  if (el) {
    el.innerHTML = `問 <span style="color:var(--yellow);font-size:16px;">${idx+1}</span> / ${PROBLEMS.length}` +
      (clearedSet.size>0 ? `　✓ ${clearedSet.size}問クリア済み` : '');
  }
}

function renderGame() {
  const area = document.getElementById('gameArea');
  const hasHand = sHand.length > 0;
  area.innerHTML = `
    <div class="card">
      <div class="prob-info">
        <h3>${prob.title}</h3>
        <p>${prob.desc}</p>
        <p class="prob-hint">💡 ヒント：${prob.hint}</p>
      </div>
      <div id="statusBar" class="status-bar"></div>
      <div class="board-wrap">
        <span class="side-label">後手（相手）</span>
        <div class="board board-5x5" id="boardEl"></div>
        <span class="side-label">先手（あなた）</span>
      </div>
      ${hasHand ? `<div id="senteHandArea" class="hand-area"><span class="hand-label">持ち駒（先手）：</span><div id="senteHand"></div></div>` : ''}
      <div class="btn-row">
        <button class="btn btn-yellow" id="hintBtn" onclick="toggleHint()">答えを見る</button>
        <button class="btn btn-muted" onclick="resetProb()">最初から</button>
        <button id="nextProbBtn" class="btn btn-yellow" onclick="nextProb()" style="display:none;">次の問題へ →</button>
      </div>
      <div id="hintText" style="display:none;margin-top:10px;font-size:12px;color:var(--muted);line-height:1.75;padding:12px;background:var(--bg);border-radius:8px;"></div>
    </div>
  `;
  updateStatus();
  renderBoard();
  renderHands();
  renderNav();
}

function updateStatus() {
  const el = document.getElementById('statusBar');
  if (!el) return;
  renderNav();
  if (phase==='move1') {
    el.className='status-bar'; el.textContent='先手番——1手で王将を詰ませよう！';
  } else if (phase==='clear') {
    el.className='status-bar ok celebrating'; el.textContent='🎉 詰み！正解！おめでとうございます！';
    const nb = document.getElementById('nextProbBtn');
    if (nb) nb.style.display = 'inline-block';
    const hb = document.getElementById('hintBtn');
    if (hb) hb.style.display = 'none';
  } else if (phase==='fail') {
    el.className='status-bar ng'; el.textContent='✕ 詰みませんでした。もう一度！';
  }
}

function renderBoard() {
  const el = document.getElementById('boardEl');
  if (!el) return;
  let movable = new Set();
  if (selected && !selectedHandKoma && phase==='move1') {
    const [sr,sc] = selected;
    const moves = getLegalMoves(board, sHand, 'sente');
    for (const m of moves) {
      if (!m.drop && m.fr===sr && m.fc===sc) movable.add(`${m.tr},${m.tc}`);
    }
  }
  if (selectedHandKoma && phase==='move1') {
    const moves = getLegalMoves(board, sHand, 'sente');
    for (const m of moves) {
      if (m.drop===selectedHandKoma) movable.add(`${m.tr},${m.tc}`);
    }
  }
  let checkSq = null;
  if (isInCheck(board,'gote')) checkSq = findKing(board,'gote');
  let html = '';
  for (let r=0;r<5;r++) for (let c=0;c<5;c++) {
    const p = board[r][c];
    const key = `${r},${c}`;
    let cls = 'sq';
    if (selected && selected[0]===r && selected[1]===c) cls += ' selected';
    else if (movable.has(key)) cls += ' movable';
    if (lastFrom && lastFrom[0]===r && lastFrom[1]===c) cls += ' last-from';
    if (lastTo   && lastTo[0]===r   && lastTo[1]===c)   cls += ' last-to';
    if (checkSq && checkSq[0]===r && checkSq[1]===c) cls += ' in-check';
    let inner = '';
    if (p) {
      const pname = p.promoted ? (PROMOTE_MAP[p.name]||p.name) : p.name;
      inner = `<div class="piece ${p.side}${p.promoted?' promoted':''}">${pname}</div>`;
    }
    html += `<div class="${cls}" onclick="clickSq(${r},${c})">${inner}</div>`;
  }
  el.innerHTML = html;
}

function renderHands() {
  const sh = document.getElementById('senteHand');
  if (!sh) return;
  if (sHand.length===0) {
    sh.innerHTML = '<span style="font-size:11px;color:var(--muted);">なし</span>';
  } else {
    sh.innerHTML = sHand.map(h => {
      const active = selectedHandKoma===h.name;
      const dis = phase!=='move1' ? ' disabled' : '';
      return `<div class="hand-koma${active?' selected':''}${dis}" onclick="clickHandKoma('${h.name}')">${h.name}</div>`;
    }).join('');
  }
}

// ============================================================
//  操作ハンドラ
// ============================================================
function clickHandKoma(name) {
  if (phase!=='move1') return;
  if (selectedHandKoma===name) { selectedHandKoma=null; selected=null; renderBoard(); renderHands(); return; }
  selectedHandKoma = name;
  selected = null;
  renderBoard(); renderHands();
}

function clickSq(r, c) {
  if (phase!=='move1') return;
  if (selectedHandKoma) {
    const moves = getLegalMoves(board, sHand, 'sente');
    const m = moves.find(mv=>mv.drop===selectedHandKoma&&mv.tr===r&&mv.tc===c);
    if (m) { executeSenteMove(m); return; }
    selectedHandKoma=null; selected=null; renderBoard(); renderHands(); return;
  }
  const p = board[r][c];
  if (selected) {
    const [sr,sc] = selected;
    if (sr===r && sc===c) { selected=null; renderBoard(); return; }
    const moves = getLegalMoves(board, sHand, 'sente');
    const candidates = moves.filter(m=>!m.drop&&m.fr===sr&&m.fc===sc&&m.tr===r&&m.tc===c);
    if (candidates.length>0) {
      if (candidates.some(m=>m.promote) && candidates.some(m=>!m.promote)) {
        pendingPromote = candidates;
        const pname = board[sr][sc].name;
        document.getElementById('promoteText').textContent =
          `${pname}を成駒（${PROMOTE_MAP[pname]}）にしますか？`;
        document.getElementById('promoteModal').classList.add('show');
        return;
      }
      executeSenteMove(candidates[0]);
      return;
    }
    if (p && p.side==='sente') { selected=[r,c]; renderBoard(); return; }
    selected=null; renderBoard(); return;
  }
  if (p && p.side==='sente') { selected=[r,c]; renderBoard(); return; }
}

function confirmPromote(yes) {
  document.getElementById('promoteModal').classList.remove('show');
  if (!pendingPromote) return;
  const m = pendingPromote.find(mv=>mv.promote===yes) || pendingPromote[0];
  pendingPromote = null;
  executeSenteMove(m);
}

// ============================================================
//  1手詰め判定
// ============================================================
function executeSenteMove(move) {
  selected=null; selectedHandKoma=null;
  const {board:nb, hand:nh} = applyMove(board, sHand, move, 'sente');
  board=nb; sHand=nh;
  lastFrom = move.drop ? null : [move.fr,move.fc];
  lastTo = [move.tr,move.tc];

  if (isCheckmateFull(board, 'gote')) {
    phase='clear';
    clearedSet.add(PROBLEMS.indexOf(prob));
    renderBoard(); renderHands(); updateStatus();
  } else {
    phase='fail';
    renderBoard(); renderHands(); updateStatus();
    setTimeout(()=>{ initProblem(PROBLEMS.indexOf(prob)); }, 1800);
  }
}

function toggleHint() {
  const el = document.getElementById('hintText');
  if (!el) return;
  if (el.style.display!=='none') { el.style.display='none'; return; }
  el.innerHTML = `<strong style="color:var(--yellow)">✅ 正解：</strong>${prob.answerDesc}<br><br>${prob.answerWhy}`;
  el.style.display='block';
}

function resetProb() {
  initProblem(PROBLEMS.indexOf(prob));
}

function nextProb() {
  const idx = PROBLEMS.indexOf(prob);
  if (idx < PROBLEMS.length-1) {
    initProblem(idx+1);
  } else {
    document.getElementById('gameArea').innerHTML = `
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div style="font-size:48px;margin-bottom:16px;">🏆</div>
        <h2 style="font-size:22px;font-weight:900;color:var(--yellow);margin-bottom:12px;">全問クリア！</h2>
        <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">5問すべての1手詰めを解きました！<br>次は3手詰めにも挑戦してみよう。</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-yellow" onclick="initProblem(0)">最初からやり直す</button>
          <a href="tsume3.html" class="btn btn-muted" style="text-decoration:none;display:inline-flex;align-items:center;">3手詰めに挑戦 →</a>
        </div>
      </div>
    `;
    renderNav();
  }
}

// 初期化
initProblem(0);
</script>
</body>
</html>
