<script>
/* ============ 設定 ============ */
const KEY=`itp-app-v2`;   /* 旧方式(覚えた/まだ)の保存キーは itp-app-v1。新UIとは互換がないので別キー */
const SET_N=10;                    /* 1セットの問数(余り5問未満は直前に合流) */
const PASS_RATE=0.8;               /* セット：8割以上で★ */
const TEST_N=10, TEST_PASS=8;      /* カテゴリテスト・総合テスト：10問中8問以上でCLEAR */
const WEAK_MAX=2;                  /* 苦手値の上限(0〜2) */
const SHOW_POINT=false;            /* 「詳しい解説」に 決め手(point) を出すか。データは残してある(将来用) */
const SHOW_MEM=false;              /* 「詳しい解説」に 覚え方(mem) を出すか。データは残してある(将来用) */
const Q=(typeof ITP_QUESTIONS!==`undefined`&&Array.isArray(ITP_QUESTIONS))?ITP_QUESTIONS:[];
const CATS=(typeof ITP_CATS!==`undefined`)?ITP_CATS:[];
const MAP=(typeof ITP_CAT_MAP!==`undefined`)?ITP_CAT_MAP:{};

/* ============ ユーティリティ ============ */
function esc(s){return String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`);}
function md(s){return esc(s).replace(/\*\*([^*]+?)\*\*/g,`<strong>$1</strong>`);}
function pad2(n){return String(n).padStart(2,`0`);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 1行解説：why の1文目(長いものは切らずに自然に折り返す) */
function short(s){const m=String(s).match(/^[\s\S]*?[。！？]/);return m?m[0]:String(s);}

/* ============ 問題の切り分け ============ */
function catQs(id){return Q.filter(q=>MAP[q.id]===id).sort((a,b)=>a.id<b.id?-1:1);}
const SB={};
function setsOf(id){
  if(SB[id])return SB[id];
  const qs=catQs(id),bs=[];
  for(let i=0;i<qs.length;i+=SET_N)bs.push({qs:qs.slice(i,i+SET_N)});
  if(bs.length>1&&bs[bs.length-1].qs.length<5){const t=bs.pop();bs[bs.length-1].qs=bs[bs.length-1].qs.concat(t.qs);}
  bs.forEach((b,i)=>{b.label=pad2(i+1);});
  return SB[id]=bs;
}

/* ============ 保存(この端末のブラウザ内だけ) ============ */
let DB=load();
function blankSet(){return {clear:0,best:0,tries:0};}
function blankTest(){return {clear:0,best:0,tries:0};}
function blank(){
  const s={},c={};
  CATS.forEach(x=>{s[x.id]=setsOf(x.id).map(blankSet);c[x.id]=blankTest();});
  return {v:1,set:s,q:{},ct:c,total:blankTest(),log:[]};
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY));
    if(o&&o.set&&o.ct){
      CATS.forEach(x=>{
        const n=setsOf(x.id).length;
        if(!o.set[x.id]||o.set[x.id].length!==n)o.set[x.id]=setsOf(x.id).map(blankSet);
        if(!o.ct[x.id])o.ct[x.id]=blankTest();
      });
      CATS.forEach(x=>o.set[x.id].forEach(s=>{if(s.star&&!s.clear)s.clear=1;if(typeof s.clear!==`number`)s.clear=0;}));   /* 旧データ(★)の引き継ぎ */
      if(!o.total)o.total=blankTest();
      if(!o.q)o.q={};
      return o;
    }
  }catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* ============ 苦手値(0〜2)：ミス+1／正解−1。テスト・苦手問題で出やすくする(画面には出さない) ============ */
function weak(id){return (DB.q[id]&&DB.q[id].w)||0;}
function weakCount(){return Q.filter(q=>weak(q.id)>=1).length;}
function weighted(pool,n){
  const items=pool.map(q=>({q:q,w:1+weak(q.id)}));   /* 重み 1 / 2 / 3 */
  const res=[];
  while(res.length<n&&items.length){
    let sum=0;items.forEach(x=>{sum+=x.w;});
    let r=Math.random()*sum,k=0;
    for(;k<items.length-1;k++){r-=items[k].w;if(r<=0)break;}
    res.push(items.splice(k,1)[0].q);
  }
  return res;
}
function clearedSets(id){return DB.set[id].filter(x=>x.clear>0).length;}

/* ============ 画面 ============ */
let S=null,screen=`home`,R=null;
function go(s){screen=s;render();window.scrollTo(0,0);}
function render(){
  const a=document.getElementById(`app`);
  if(!Q.length){a.innerHTML=`<p class="mq-note">問題データが読み込めませんでした。</p>`;return;}
  document.body.classList.toggle(`inquiz`,screen===`quiz`);
  if(screen===`quiz`){
    /* 回答後まで1画面に収まる縮小率を、問題ごと・画面サイズごとに1回だけ計算する(回答したときに文字が変わらないように) */
    const key=S.idx+`:`+innerWidth+`x`+innerHeight;
    if(S.scaleKey!==key){S.scale=calcScale(a);S.scaleKey=key;}
    a.style.setProperty(`--qs`,S.scale);
  }else{a.style.removeProperty(`--qs`);}
  a.innerHTML=({home:homeView,quiz:quizView,result:resultView})[screen]();
}
const MIN_SCALE=0.8;   /* 縮小の下限。これでも収まらないときだけスクロールに任せる */
function calcScale(a){
  const sa=S.answered,sp=S.picked;
  S.answered=true;S.picked=Math.max(0,S.order.findIndex(c=>c.correct!==true));   /* 回答後(いちばん高い状態)で測る */
  let s=1;
  a.style.setProperty(`--qs`,s);a.innerHTML=quizView();
  while(s>MIN_SCALE&&document.documentElement.scrollHeight>innerHeight){
    s=Math.round((s-0.03)*100)/100;a.style.setProperty(`--qs`,s);
  }
  S.answered=sa;S.picked=sp;
  return s;
}
let rsT=null;
window.addEventListener(`resize`,()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(screen===`quiz`&&S)render();},150);});
function statLine(t){
  return t.tries?`<span class="stat">CLEAR <b>${t.clear}</b>回　BEST <b>${t.best}</b>/${TEST_N}</span>`:`<span class="stat">未挑戦</span>`;
}

/* ============ ホーム ============ */
function homeView(){
  const wk=weakCount();
  const top=`<div class="tests">
    <div class="row"><div class="row__l">総合テスト<small>全${Q.length}問から${TEST_N}問(苦手問題は少し多めに出ます)</small></div>
      <div>${statLine(DB.total)} <button class="mq-btn" style="margin-left:8px" onclick="startTotal()">挑戦する</button></div></div>
    <div class="row"><div class="row__l">苦手問題<small>${wk?`${wk}問`:`間違えた問題がここにたまります`}</small></div>
      <div><button class="mq-btn" ${wk?``:`disabled`} onclick="startWeak()">${Math.min(TEST_N,wk)}問解く</button></div></div>
  </div>`;
  let rows=``;
  CATS.forEach(c=>{
    const ss=setsOf(c.id),st=DB.set[c.id];
    const nextI=st.findIndex(x=>!(x.clear>0));
    let cells=``;
    ss.forEach((b,i)=>{
      const s=st[i];
      cells+=`<button class="set${s.clear>0?` is-clear`:``}${i===nextI?` is-next`:``}" onclick="startSet('${c.id}',${i})" aria-label="セット${b.label}">
        <span class="set__no">${b.label}</span>
        <span class="set__l c">CLEAR ${s.clear}回</span>
        <span class="set__l">BEST ${s.tries?`${s.best}/${b.qs.length}`:`－`}</span></button>`;
    });
    rows+=`<section class="cat">
      <div class="cat__top"><h3 class="cat__name">${esc(c.name)}</h3><span class="cat__num">${clearedSets(c.id)} / ${ss.length} セットCLEAR</span></div>
      <div class="sets">${cells}</div>
      <div class="cattest"><div class="row"><div class="row__l">カテゴリテスト</div><div>${statLine(DB.ct[c.id])} <button class="mq-btn" style="margin-left:8px" onclick="startCat('${c.id}')">${TEST_N}問テスト</button></div></div></div>
    </section>`;
  });
  return `<section class="mq-pagehead fade">
    <p class="mq-kicker">600問・登録不要・無料</p>
    <h1 class="mq-title">ITパスポート 過去問マスター</h1>
    <p class="mq-lead">10問ずつ解いて、8問以上でCLEAR。<br>カテゴリテストと総合テストは、いつでも挑戦できます。</p>
  </section>
  ${top}
  <div style="margin-top:22px">${rows}</div>
  <div class="setrow"><button class="mq-link mq-small" onclick="resetAll()">学習データをリセット</button></div>`;
}
function resetAll(){if(confirm(`このページの学習データ(進み具合・苦手問題の記録)をすべて消します。よろしいですか？`)){DB=blank();save();render();}}

/* ============ セッション ============ */
function begin(o){S=Object.assign({idx:0,score:0,missed:[]},o);prep();go(`quiz`);}
function startSet(id,i){
  const b=setsOf(id)[i];
  begin({mode:`set`,cat:id,si:i,label:b.label,list:shuffle(b.qs),pass:Math.ceil(b.qs.length*PASS_RATE)});
}
function startCat(id){const l=weighted(catQs(id),Math.min(TEST_N,catQs(id).length));begin({mode:`cat`,cat:id,list:l,pass:Math.ceil(l.length*TEST_PASS/TEST_N)});}
function startTotal(){const l=weighted(Q,Math.min(TEST_N,Q.length));begin({mode:`total`,cat:null,list:l,pass:Math.ceil(l.length*TEST_PASS/TEST_N)});}
function startWeak(){
  const pool=Q.filter(q=>weak(q.id)>=1);if(!pool.length)return;
  begin({mode:`weak`,cat:null,list:weighted(pool,Math.min(TEST_N,pool.length))});
}
function prep(){const q=S.list[S.idx];S.order=shuffle(q.choices);S.answered=false;S.picked=-1;S.t0=Date.now();}

function pick(i){
  if(S.answered)return;
  const q=S.list[S.idx];
  S.answered=true;S.picked=i;
  const ok=S.order[i].correct===true;
  const r=DB.q[q.id]||(DB.q[q.id]={w:0,c:0,x:0});
  if(ok){S.score++;r.c++;r.w=Math.max(0,r.w-1);}
  else{S.missed.push(q.id);r.x++;r.w=Math.min(WEAK_MAX,r.w+1);}
  DB.log.push({id:q.id,m:S.mode,ok:ok,ms:Date.now()-S.t0,t:new Date().toISOString().slice(0,10)});
  if(DB.log.length>3000)DB.log=DB.log.slice(-3000);
  save();render();
}
function next(){
  S.idx++;
  if(S.idx>=S.list.length){finish();return;}
  prep();go(`quiz`);
}
function finish(){
  const n=S.list.length,pct=n?Math.round(S.score/n*100):0,pass=S.mode!==`weak`&&S.score>=S.pass;
  let rec=null;
  if(S.mode===`set`){rec=DB.set[S.cat][S.si];}
  else if(S.mode===`cat`){rec=DB.ct[S.cat];}
  else if(S.mode===`total`){rec=DB.total;}
  if(rec){
    rec.tries++;rec.best=Math.max(rec.best,S.score);
    if(pass)rec.clear++;
  }
  save();
  R={mode:S.mode,cat:S.cat,si:S.si,label:S.label,score:S.score,n:n,pass:pass,need:S.pass,missed:S.missed.length,perfect:S.mode!==`weak`&&S.score===n};
  go(`result`);
}

/* ============ 出題画面(4択そのものが採点結果になる) ============ */
const MODE_NAME={set:`セット`,cat:`カテゴリテスト`,total:`総合テスト`,weak:`苦手問題`};
function catName(id){const c=CATS.find(x=>x.id===id);return c?c.name:``;}
function quizView(){
  const q=S.list[S.idx],n=S.list.length;
  const where=S.mode===`set`?`${catName(S.cat)} ${S.label}`:S.mode===`cat`?catName(S.cat):S.mode===`total`?`全${Q.length}問`:``;
  let h=`<div class="qhead"><button class="mq-link back" onclick="if(confirm('ホームに戻ります。途中の回答は残りません(間違えた問題の記録は残ります)。')){go('home')}">← ホーム</button><span class="w"><span class="mq-badge mq-badge--brand">${MODE_NAME[S.mode]}</span>${esc(where)}</span><span class="cnt">${S.idx+1} / ${n}</span></div>
  <p class="mq-question">${md(q.q)}</p>
  <div class="qs">`;
  S.order.forEach((c,i)=>{
    let cls=`qc${S.answered?` done`:``}`,mk=``;
    if(S.answered){
      if(c.correct===true){cls+=` is-correct`;mk=`<span class="mk">◯</span>`;}
      else if(i===S.picked){cls+=` is-wrong`;mk=`<span class="mk">✕</span>`;}
    }
    h+=`<div class="${cls}"><button class="mq-choice" ${S.answered?`disabled`:`onclick="pick(${i})"`}>${md(c.text)}</button>${mk}${S.answered?`<div class="ex">${md(short(c.why))}</div>`:``}</div>`;
  });
  h+=`</div>`;
  if(S.answered){
    const ok=S.order[S.picked].correct===true;
    const whys=S.order.map(c=>`<li><b style="color:${c.correct?`var(--mq-ok)`:`var(--mq-ng)`}">${c.correct?`◯`:`✕`}</b>${md(c.text)}<br><span class="mq-muted">${md(c.why)}</span></li>`).join(``);
    h+=`<details class="mq-details" style="margin-top:6px"><summary>詳しい解説を見る</summary><div class="mq-details__body">
      ${SHOW_POINT?`<p class="mq-note" style="margin-top:4px"><span class="mq-note__label">決め手</span>${md(q.point)}</p>`:``}
      <ul class="why" style="margin-top:6px">${whys}</ul>
      ${SHOW_MEM?`<p class="mq-note"><span class="mq-note__label">覚え方</span>${md(q.mem)}</p>`:``}
      <p class="mq-prose"><a class="detaillink" href="articles/${esc(q.detailSlug)}.html" target="_blank" rel="noopener">この概念の詳しい解説記事を読む →</a></p>
    </div></details>
    <div class="stick"><span class="verdict ${ok?`ok`:`ng`}">${ok?`正解`:`不正解`}</span><button class="mq-btn" onclick="next()">${S.idx+1>=n?`結果を見る`:`次の問題へ`}</button></div>`;
  }
  return h;
}

/* ============ 結果 ============ */
function resultView(){
  const r=R;
  const title=r.mode===`set`?`${catName(r.cat)} ${r.label}`:r.mode===`cat`?`${catName(r.cat)} カテゴリテスト`:r.mode===`total`?`総合テスト`:`苦手問題`;
  let lead=``,btns=``;
  if(r.mode===`weak`){
    const left=weakCount();
    lead=`${r.n}問中 ${r.score}問 正解。<br>${left?`苦手問題は あと${left}問です。`:`苦手問題はなくなりました。`}`;
    btns=(left?`<button class="mq-btn mq-btn--block" onclick="startWeak()">もう一度 ${Math.min(TEST_N,left)}問解く</button>`:``)
        +`<div style="text-align:center"><button class="mq-link" onclick="go('home')">ホームへ</button></div>`;
  }else{
    const flag=r.pass?(r.perfect?`<span class="perfect">PERFECT</span>`:`CLEAR`):`あと${r.need-r.score}問`;
    const miss=r.missed?`間違えた${r.missed}問は、苦手問題に追加しました。`:`全問正解です。`;
    if(r.mode===`set`){
      const rec=DB.set[r.cat][r.si],ss=setsOf(r.cat);
      lead=`${r.pass?``:`${r.need}問以上でCLEARです。<br>`}CLEAR ${rec.clear}回　BEST ${rec.best} / ${r.n}<br>${miss}`;
      const hasNext=r.si+1<ss.length;
      btns=(r.pass&&hasNext?`<button class="mq-btn mq-btn--block" onclick="startSet('${r.cat}',${r.si+1})">次のセット(${ss[r.si+1].label})</button>`:`<button class="mq-btn mq-btn--block" onclick="startSet('${r.cat}',${r.si})">もう一度</button>`)
        +`<div style="text-align:center">${r.pass&&hasNext?`<button class="mq-link" onclick="startSet('${r.cat}',${r.si})">もう一度</button>`:``}<button class="mq-link" onclick="go('home')">ホームへ</button></div>`;
    }else{
      const t=r.mode===`cat`?DB.ct[r.cat]:DB.total;
      lead=`CLEAR ${t.clear}回　BEST ${t.best} / ${TEST_N}<br>${miss}`;
      btns=`<button class="mq-btn mq-btn--block" onclick="${r.mode===`cat`?`startCat('${r.cat}')`:`startTotal()`}">もう一度挑戦</button>
        <div style="text-align:center"><button class="mq-link" onclick="go('home')">ホームへ</button></div>`;
    }
    return `<section class="mq-pagehead fade">
      <p class="mq-kicker">${esc(title)}</p>
      <div class="big${r.pass&&r.perfect?` perfect`:``}" ${r.pass&&!r.perfect?`style="color:var(--mq-ok)"`:``}>${r.score} / ${r.n}</div>
      <p style="margin:8px 0 0;font-size:18px;font-weight:800">${flag}</p>
      <p class="mq-lead">${lead}</p>
    </section>
    <div class="mq-next" style="margin-top:22px">${btns}</div>`;
  }
  return `<section class="mq-pagehead fade">
    <p class="mq-kicker">${esc(title)}</p>
    <div class="big">${r.score} / ${r.n}</div>
    <p class="mq-lead">${lead}</p>
  </section>
  <div class="mq-next" style="margin-top:22px">${btns}</div>`;
}

render();
</script>
</body></html>
