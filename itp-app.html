<script src="data/itp-questions.js"></script>
<script>
/* ============ データ ============ */
const QUESTIONS=(typeof ITP_QUESTIONS!==`undefined`&&Array.isArray(ITP_QUESTIONS))?ITP_QUESTIONS:[];
const TOTAL=QUESTIONS.length;

/* ============ 間隔反復エンジン（エンジン見本から流用） ============ */
const STORAGE_KEY=`itp-app-v1`;
const STEPS=[1,3,7,14,30];          /* 正答で伸ばす間隔（日） */
const MASTER_DS=STEPS.length-1;     /* この段階＝マスター（保留） */
const DEFAULT_NEW_PER_DAY=8;        /* C-5：1日の新出上限（既定8・調整可） */
const MAX_REVIEW=24;                /* C-4：1セッションの復習上限（数分で終わる量） */

function pad2(n){return String(n).padStart(2,`0`);}
function ymd(d){return d.getFullYear()+`-`+pad2(d.getMonth()+1)+`-`+pad2(d.getDate());}
function todayStr(){return ymd(new Date());}
function addDaysStr(base,n){const d=new Date(base+`T00:00:00`);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){const da=new Date(a+`T00:00:00`),db=new Date(b+`T00:00:00`);return Math.round((db-da)/86400000);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`);}
function catClass(c){return c===`ストラテジ`?`c-st`:c===`マネジメント`?`c-mg`:`c-tc`;}

/* ============ localStorage（C-2） ============ */
let DB=loadDB();
function loadDB(){
  try{
    const o=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(o&&o.q){
      if(!o.streak)o.streak={count:0,last:``};
      if(!o.newDay)o.newDay={date:``,count:0};
      if(typeof o.examDate!==`string`)o.examDate=``;
      if(typeof o.newPerDay!==`number`)o.newPerDay=DEFAULT_NEW_PER_DAY;
      return o;
    }
  }catch(e){}
  return {q:{},streak:{count:0,last:``},newDay:{date:``,count:0},examDate:``,newPerDay:DEFAULT_NEW_PER_DAY};
}
function saveDB(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));}catch(e){}}

/* ============ 状態の集計 ============ */
function counts(){
  let mastered=0,practicing=0,untouched=0;
  QUESTIONS.forEach(q=>{
    const s=DB.q[q.id];
    if(!s)untouched++;
    else if(s.ds>=MASTER_DS)mastered++;
    else practicing++;
  });
  return {mastered:mastered,practicing:practicing,untouched:untouched};
}

/* ============ セッション構築（C-5 ドーズ設計） ============ */
function buildSession(){
  const today=todayStr();
  if(DB.newDay.date!==today){DB.newDay={date:today,count:0};saveDB();}
  const due=[],fresh=[];
  QUESTIONS.forEach((q,i)=>{
    const s=DB.q[q.id];
    if(!s)fresh.push(i);
    else if(s.due&&s.due<=today)due.push(i);   /* 保留(マスター)も期日が来たらここに入る */
  });
  /* 復習が主体（C-4の上限内） */
  const reviews=shuffle(due).slice(0,MAX_REVIEW);
  /* 新出は少量ドーズ（1日上限 − 今日すでに消化した数） */
  const slots=Math.max(0,DB.newPerDay-DB.newDay.count);
  const newPick=shuffle(fresh).slice(0,slots);
  /* 新出は先頭に固めず復習へ散らす（先頭は復習を維持） */
  const queue=reviews.slice();
  newPick.forEach(n=>{
    const lo=queue.length>0?1:0;
    const pos=lo+Math.floor(Math.random()*(queue.length-lo+1));
    queue.splice(pos,0,n);
  });
  return {queue:queue,reviewCount:reviews.length,newCount:newPick.length,newIds:newPick.map(i=>QUESTIONS[i].id)};
}

function bumpStreak(){
  const today=todayStr();
  if(DB.streak.last===today)return;
  if(DB.streak.last===addDaysStr(today,-1))DB.streak.count++;
  else DB.streak.count=1;
  DB.streak.last=today;
}

function tomorrowEstimate(){
  const tmr=addDaysStr(todayStr(),1);
  let due=0,fresh=0;
  QUESTIONS.forEach(q=>{
    const s=DB.q[q.id];
    if(!s)fresh++;
    else if(s.due&&s.due<=tmr)due++;
  });
  return Math.min(MAX_REVIEW,due)+Math.min(DB.newPerDay,fresh);
}

/* ============ 視覚化（C-3） ============ */
function countdown(){return DB.examDate?diffDays(todayStr(),DB.examDate):null;}
function paceText(){
  const c=counts();
  const remain=TOTAL-c.mastered;
  const cd=countdown();
  if(cd===null)return `試験日を設定すると、1日の目安が出ます`;
  if(cd<0)return `試験日は過ぎています。下から更新できます`;
  const days=Math.max(1,cd);
  const per=Math.ceil(remain/days);
  return `🎯 合格まであと ${remain}問　／　このペースなら1日 約${per}問`;
}
function statsHTML(){
  const c=counts();
  const cd=countdown();
  let cdText;
  if(cd===null)cdText=`📅 試験日 未設定`;
  else if(cd<0)cdText=`📅 試験日 経過`;
  else if(cd===0)cdText=`📅 試験は今日！`;
  else cdText=`📅 試験まで あと${cd}日`;
  const pct=TOTAL?(c.mastered/TOTAL*100):0;
  return `<div class="stats">
    <div class="strow">
      <span class="streak">🔥 ${DB.streak.count}日連続</span>
      <span class="exam">${cdText}</span>
    </div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="meterlbl">🎯 ${TOTAL}問中 <b>${c.mastered}問</b> マスター（あと${TOTAL-c.mastered}問）</div>
    <div class="statestrip">
      <span>📘 練習中 <b>${c.practicing}</b></span>
      <span>✅ 保留 <b>${c.mastered}</b></span>
    </div>
  </div>`;
}
function footHTML(){
  return `<div class="foot">
    <div class="setrow">1日の新しい問題の上限
      <button class="step" onclick="adjNew(-2)">−</button>
      <b>${DB.newPerDay}</b>
      <button class="step" onclick="adjNew(2)">＋</button>
    </div>
    <span class="resetlink" onclick="resetAll()">学習データをリセット</span>
  </div>`;
}

/* ============ 画面状態 ============ */
let session=null,started=false,queue=[],total=0,doneCount=0,correctCount=0;
let current=null,answered=false,picked=-1;

function loadQuestion(){
  if(queue.length===0){current=null;return;}
  const q=QUESTIONS[queue[0]];
  current={q:q,order:shuffle(q.choices)};   /* C-1：選択肢を毎回シャッフル */
  answered=false;picked=-1;
}

/* ============ レンダリング ============ */
function render(){
  const v=document.getElementById(`view`);
  if(TOTAL===0){
    v.innerHTML=`<div class="card"><div class="qtext">問題データ（data/itp-questions.js）が読み込めませんでした。<br>data/itp-questions.js の配置を確認してください。</div></div>`;
    return;
  }
  if(!started){v.innerHTML=startScreen();return;}
  if(queue.length===0){v.innerHTML=doneScreen();return;}
  v.innerHTML=quizScreen();
}

function startScreen(){
  session=buildSession();
  const norm=session.queue.length;
  let examBlock;
  if(!DB.examDate){
    examBlock=`<div class="examset">
      <div class="examttl">📅 試験日を入れると、毎日の目安（ノルマ）が出ます</div>
      <input type="date" id="examInput" class="dateinput">
      <button class="mini" onclick="saveExam()">設定</button>
    </div>`;
  }else{
    examBlock=`<div class="pace">${esc(paceText())}</div>
      <div class="examchg"><span onclick="clearExam()">試験日を変更する</span></div>`;
  }
  if(norm===0){
    return `${statsHTML()}
    <div class="card done">
      <div class="emo">🌙</div>
      <h2>今日のぶんは完了！</h2>
      <p>いま出す問題はありません。<br>また明日、ちょうど忘れかけた頃に出します。</p>
      ${examBlock}
    </div>${footHTML()}`;
  }
  const rPct=norm?Math.round(session.reviewCount/norm*100):0;
  return `${statsHTML()}
  <div class="card">
    <div class="startttl">今日の学習</div>
    <div class="plan">
      <div class="planrow"><span>🔁 復習（一度出会った問題）</span><b>${session.reviewCount}</b></div>
      <div class="planrow"><span>✨ 新しい問題（少量ずつ）</span><b>${session.newCount}</b></div>
      <div class="planrow total"><span>今日のノルマ 合計</span><b>${norm}問</b></div>
    </div>
    ${examBlock}
    <p class="note">${rPct>=50?`今日の${rPct}%は復習。`:``}4択を選ぶ → 答え合わせ → 4つの「なぜ」。<br>外した問題は「詳しい解説」で深掘りできます。</p>
    <button class="flip" onclick="startSession()">スタート ▶</button>
  </div>${footHTML()}`;
}

function quizScreen(){
  const q=current.q;
  const remain=queue.length;
  const prog=total?(doneCount/total*100):0;
  let body=`${statsHTML()}
  <div class="bar"><i style="width:${prog}%"></i></div>
  <div class="progresslbl">完了 ${doneCount} / ${total}　｜　あと ${remain}問で今日終わり</div>
  <div class="card">
    <span class="cat ${catClass(q.cat)}">${esc(q.cat)}</span>
    <div class="qtext">${esc(q.q)}</div>`;
  if(!answered){
    body+=`<div class="choices">`;
    current.order.forEach((ch,i)=>{
      body+=`<button class="choice" onclick="pickChoice(${i})">${esc(ch.text)}</button>`;
    });
    body+=`</div>`;
  }else{
    const isCorrect=current.order[picked].correct===true;
    const isNew=session.newIds.indexOf(q.id)>=0;
    let bcls,bt,bs;
    if(isCorrect){
      bcls=`ok`;bt=`🎉 正解！`;bs=`しっかり選べました。この調子。`;
    }else if(isNew){
      /* C-5：初見の誤答は前向きフレーミング */
      bcls=`new`;bt=`👋 初めまして！`;
      bs=`この出会いで"覚えるスイッチ"が入りました。初見の失敗は設計どおり — 次に出たら思い出せます。`;
    }else{
      bcls=`ng`;bt=`× 不正解`;bs=`下の「なぜ」と詳しい解説で、取り戻しましょう。`;
    }
    body+=`<div class="banner ${bcls}"><div class="bt">${bt}</div><div class="bs">${bs}</div></div>
    <div class="rwrap">`;
    current.order.forEach((ch,i)=>{
      const isC=ch.correct===true;
      const isP=i===picked;
      let cls=`rchoice`;
      if(isC)cls+=` correct`;
      if(isP)cls+=` picked`;
      body+=`<div class="${cls}">
        <div class="rhead">
          <span class="rmark">${isC?`◯`:`✕`}</span>
          <span class="rtext">${esc(ch.text)}</span>
          ${isP?`<span class="yourtag">あなたの答え</span>`:``}
        </div>
        <div class="rwhy">${esc(ch.why)}</div>
      </div>`;
    });
    body+=`</div>
    <div class="point"><div class="plabel">🔑 見分けの決め手</div><div class="pbody">${esc(q.point)}</div></div>
    <div class="mem"><div class="mlabel">🧠 覚え方</div><div class="mbody">${esc(q.mem)}</div></div>`;
    if(!isCorrect){
      /* C-1／§4-6：間違えた時だけ詳しい解説リンク */
      body+=`<a class="detaillink" href="articles/${esc(q.detailSlug)}.html" target="_blank" rel="noopener">📖 この概念の詳しい解説を読む →</a>`;
    }
    body+=`<div class="judgewrap">
      <div class="jt">この問題、次にいつ出す？</div>
      <div class="jrow">
        <button class="jbtn jrem${isCorrect?` suggest`:``}" onclick="judge(true)">✅ 覚えた</button>
        <button class="jbtn jstill${isCorrect?``:` suggest`}" onclick="judge(false)">🔁 まだ</button>
      </div>
    </div>`;
  }
  body+=`</div>`+footHTML();
  return body;
}

function doneScreen(){
  return `${statsHTML()}
  <div class="card done">
    <div class="emo">🎉</div>
    <h2>今日の${total}問クリア！</h2>
    <p>🔥 ${DB.streak.count}日連続。<br>このセッションの正解 ${correctCount} / ${total}。</p>
    <p class="note2">外した問題は明日また出ます — 忘れかけで解き直すのが、いちばん記憶に残ります。<br>明日の目安：約 ${tomorrowEstimate()}問</p>
  </div>${footHTML()}`;
}

/* ============ 操作 ============ */
function startSession(){
  session=buildSession();
  queue=session.queue.slice();
  total=queue.length;
  doneCount=0;correctCount=0;
  started=true;
  loadQuestion();
  render();window.scrollTo(0,0);
}

function pickChoice(i){
  if(answered)return;
  answered=true;picked=i;
  render();window.scrollTo(0,0);
}

function judge(remembered){
  if(!answered||!current)return;
  const q=current.q;
  bumpStreak();
  const wasNew=!DB.q[q.id];
  let s=DB.q[q.id]||{ds:-1,reps:0,due:``,last:``};
  const today=todayStr();
  s.reps++;
  s.last=today;
  if(remembered){
    /* 正答パス：1→3→7→14→30日 */
    s.ds=Math.min(s.ds+1,MASTER_DS);
    s.due=addDaysStr(today,STEPS[s.ds]);
  }else{
    /* 誤答パス：翌日 */
    s.ds=0;
    s.due=addDaysStr(today,1);
  }
  DB.q[q.id]=s;
  if(wasNew&&session.newIds.indexOf(q.id)>=0)DB.newDay.count++;
  saveDB();

  if(current.order[picked]&&current.order[picked].correct===true)correctCount++;
  doneCount++;
  queue.shift();

  showToast(remembered
    ?`✅ 覚えた！ 少し先に、忘れかけた頃にまた出します。`
    :`🔁 明日また出します。くり返すほど定着します。`);

  loadQuestion();
  render();window.scrollTo(0,0);
}

function saveExam(){
  const el=document.getElementById(`examInput`);
  if(!el||!el.value){showToast(`📅 試験日を選んでください`);return;}
  DB.examDate=el.value;saveDB();render();
}
function clearExam(){DB.examDate=``;saveDB();render();}
function adjNew(d){
  DB.newPerDay=Math.max(2,Math.min(30,DB.newPerDay+d));
  saveDB();render();
}
function resetAll(){
  if(confirm(`学習データをすべて消して最初からにします。よろしいですか？`)){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

function showToast(msg){
  const old=document.getElementById(`toast`);if(old)old.remove();
  const t=document.createElement(`div`);
  t.id=`toast`;t.className=`toast`;t.innerHTML=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.transition=`opacity .4s`;t.style.opacity=`0`;setTimeout(()=>{if(t.parentNode)t.remove();},400);},2400);
}

/* ============ 起動 ============ */
render();
</script>
</body>
