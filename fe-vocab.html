<script>
// ===== STATE =====
let pool = [];
let queue = [];
let current = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let wrongIds = [];

// フィルター設定
let selCat = 'all';
let selFreq = 'all';
let selCount = 20;

// 累計学習記録（sessionStorage）
let totalDone = parseInt(sessionStorage.getItem('boki3_vocab_done') || '0');
let totalCorrect = parseInt(sessionStorage.getItem('boki3_vocab_correct') || '0');

// ===== INIT =====
function updateStats() {
  document.getElementById('statDone').textContent = totalDone;
  const acc = totalDone > 0 ? Math.round(totalCorrect / totalDone * 100) + '%' : '-';
  document.getElementById('statAcc').textContent = acc;
}
updateStats();

// フィルターボタン
document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selCat = btn.dataset.cat;
  });
});
document.querySelectorAll('.filter-btn[data-freq]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-freq]').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selFreq = btn.dataset.freq;
  });
});
document.querySelectorAll('.count-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selCount = btn.dataset.count === 'all' ? 9999 : parseInt(btn.dataset.count);
  });
});

document.getElementById('startBtn').addEventListener('click', () => startQuiz(false));
document.getElementById('retryBtn').addEventListener('click', () => startQuiz(false));
document.getElementById('wrongOnlyBtn').addEventListener('click', () => startQuiz(true));
document.getElementById('nextBtn').addEventListener('click', nextCard);

// ===== QUIZ LOGIC =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(wrongOnly) {
  // フィルタリング
  let filtered = FE_VOCAB;
  if (wrongOnly && wrongIds.length > 0) {
    filtered = FE_VOCAB.filter(c => wrongIds.includes(c.id));
  } else {
    if (selCat !== 'all') filtered = filtered.filter(c => c.cat === selCat);
    if (selFreq === 'high') filtered = filtered.filter(c => c.freq === 'high');
  }

  if (filtered.length === 0) {
    alert('条件に合う問題がありません。フィルターを変えてみてください。');
    return;
  }

  pool = shuffle(filtered).slice(0, Math.min(selCount, filtered.length));
  queue = [...pool];
  current = 0;
  correctCount = 0;
  wrongCount = 0;
  wrongIds = [];

  showScreen('quizScreen');
  renderCard();
}

function renderCard() {
  if (current >= queue.length) {
    showResult();
    return;
  }

  answered = false;
  const card = queue[current];
  const total = queue.length;

  // ヘッダー更新
  document.getElementById('progressText').textContent = `${current + 1} / ${total}`;
  document.getElementById('scoreBadge').textContent = `✅ ${correctCount} / ❌ ${wrongCount}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;

  // カード内容
  const catEl = document.getElementById('cardCat');
  catEl.textContent = card.cat;
  catEl.className = 'card-cat-badge cat-' + card.cat;

  const freqEl = document.getElementById('cardFreq');
  freqEl.textContent = card.freq === 'high' ? '🔥 高頻度' : '';
  freqEl.className = 'freq-badge' + (card.freq === 'mid' ? ' mid' : '');

  document.getElementById('cardScenario').textContent = card.scenario || '';
  document.getElementById('cardKw').textContent = '🔑 ' + (card.keyword || '');
  document.getElementById('cardQ').textContent = card.q;

  // 解説リセット
  document.getElementById('expPanel').classList.remove('show');
  document.getElementById('exp1Text').textContent = card.exp1 || '';
  document.getElementById('exp2Text').textContent = card.exp2 || '';
  const exp3Row = document.querySelector('.exp-row.exp3');
  if (card.exp3) {
    document.getElementById('exp3Text').textContent = card.exp3;
    exp3Row.style.display = '';
  } else {
    exp3Row.style.display = 'none';
  }

  // 覚え方リセット（A化2.0 memoryフィールド）
  const memoryRow = document.getElementById('memoryRow');
  memoryRow.style.display = 'none';

  // SVG表示
  const svgRow = document.getElementById('svgRow');
  const svgArea = document.getElementById('svgArea');
  if (card.svg) {
    svgArea.innerHTML = card.svg;
    svgRow.style.display = '';
  } else {
    svgArea.innerHTML = '';
    svgRow.style.display = 'none';
  }

  // 選択肢
  const area = document.getElementById('choicesArea');
  area.innerHTML = '';
  const choices = shuffle(card.choices);
  choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-icon">${i === 0 ? 'Ⓐ' : 'Ⓑ'}</span><span>${ch.text}</span>`;
    btn.addEventListener('click', () => selectAnswer(btn, ch.correct, card));
    area.appendChild(btn);
  });

  document.getElementById('nextBtn').classList.remove('show');
  // ポップインアニメ
  document.getElementById('vocabCard').classList.remove('pop');
  void document.getElementById('vocabCard').offsetWidth;
  document.getElementById('vocabCard').classList.add('pop');
}

function selectAnswer(btn, isCorrect, card) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    // 正解ボタンを緑に
    const text = b.querySelector('span:last-child').textContent;
    const isThisCorrect = card.choices.some(c => c.text === text && c.correct);
    if (isThisCorrect) b.classList.add('correct');
  });

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    totalCorrect++;
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongIds.push(card.id);
  }
  totalDone++;
  sessionStorage.setItem('boki3_vocab_done', totalDone);
  sessionStorage.setItem('boki3_vocab_correct', totalCorrect);
  updateStats();

  // 解説表示
  document.getElementById('expPanel').classList.add('show');

  // A化2.0: 覚え方セクション表示
  const memoryRow = document.getElementById('memoryRow');
  if (card.memory) {
    document.getElementById('memoryText').textContent = card.memory;
    memoryRow.style.display = '';
  } else {
    memoryRow.style.display = 'none';
  }

  const artBtn = document.getElementById('articleBtn');
  artBtn.style.display = 'none';
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').textContent = current + 1 >= queue.length ? '結果を見る 🎉' : '次の問題へ →';
}

function nextCard() {
  current++;
  renderCard();
}

function showResult() {
  showScreen('resultScreen');
  const total = queue.length;
  const acc = Math.round(correctCount / total * 100);

  document.getElementById('resultScore').textContent = correctCount;
  document.getElementById('resultDenom').textContent = `/ ${total} 問正解`;
  document.getElementById('resultCorrect').textContent = correctCount;
  document.getElementById('resultWrong').textContent = wrongCount;
  document.getElementById('resultAcc').textContent = acc + '%';
  document.getElementById('resultTotal').textContent = totalDone + '問';

  let title, msg;
  if (acc >= 90) { title = '🏆 完璧！'; msg = 'ほぼ完璧！基本情報技術者クイズにも自信を持って挑もう。'; }
  else if (acc >= 70) { title = '👍 いい感じ！'; msg = '基本はOK。間違えた問題をもう一度やって完成させよう。'; }
  else if (acc >= 50) { title = '📖 もう少し！'; msg = '半分以上は理解できてる。苦手な仕訳を集中的に復習しよう。'; }
  else { title = '💪 まだまだこれから！'; msg = 'シナリオをじっくり読んで、借方・貸方のイメージをつかんでいこう。'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;

  const wrongBtn = document.getElementById('wrongOnlyBtn');
  wrongBtn.style.display = wrongIds.length > 0 ? 'block' : 'none';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
</script>
